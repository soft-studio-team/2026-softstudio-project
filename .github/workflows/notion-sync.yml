name: Notion Task Status Sync

on:
  pull_request:
    types: [opened, closed]

jobs:
  update-notion-status:
    runs-on: ubuntu-latest
    steps:
      - name: Update Notion Task Status
        uses: actions/github-script@v7
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        with:
          script: |
            const prTitle = context.payload.pull_request.title;
            const isMerged = context.payload.pull_request.merged;
            const action = context.payload.action;

            let targetStatus = '';
            if (action === 'opened') {
              targetStatus = '진행 중';
            } else if (action === 'closed' && isMerged) {
              targetStatus = '완료';
            }

            if (!targetStatus) return;

            const headers = {
              'Authorization': `Bearer ${process.env.NOTION_TOKEN}`,
              'Notion-Version': '2022-06-28',
              'Content-Type': 'application/json'
            };

            const queryRes = await fetch(`https://api.notion.com/v1/databases/${process.env.NOTION_DATABASE_ID}/query`, {
              method: 'POST',
              headers: headers,
              body: JSON.stringify({})
            });
            const queryData = await queryRes.json();

            for (const page of queryData.results) {
              const taskTitle = page.properties['내용']?.title?.[0]?.plain_text;
              if (taskTitle && prTitle.includes(taskTitle)) {
                await fetch(`https://api.notion.com/v1/pages/${page.id}`, {
                  method: 'PATCH',
                  headers: headers,
                  body: JSON.stringify({
                    properties: {
                      '상태': {
                        status: { name: targetStatus }
                      }
                    }
                  })
                });
                console.log(`Updated "${taskTitle}" status to ${targetStatus}`);
              }
            }
